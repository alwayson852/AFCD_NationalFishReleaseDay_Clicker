<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sea Interactive - Interaction Only</title>
    <style>
        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            overflow: hidden; background-color: #000;
            font-family: "PingFang HK", "Microsoft JhengHei", sans-serif;
        }

        .layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        /* 1. 影片層 (底層) */
        #video-layer { 
            z-index: 1; 
            object-fit: cover; 
            pointer-events: none; 
        }

        /* 2. 魚群容器 (目前保持空白) */
        #fish-layer {
            z-index: 5;
            pointer-events: none;
            position: absolute;
            width: 100%; height: 100%;
        }

        /* 3. 互動層：Lock */
        .interactive-zone {
            z-index: 10;
            display: flex; justify-content: center; align-items: center;
            pointer-events: none;
        }

        #lock-container {
            position: relative; 
            width: 35vmin; 
            height: 35vmin;
            display: flex; 
            justify-content: center; 
            align-items: center;
            cursor: pointer; 
            pointer-events: auto;
            -webkit-tap-highlight-color: transparent;
        }

        #lock-img {
            width: 100%; 
            height: auto; 
            z-index: 12;
            transition: transform 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* 點擊時的 Bump 動畫 */
        #lock-container.bump #lock-img { 
            transform: scale(0.8); 
        }

        /* Lock 點擊產生的波紋 (Ripple) */
        .ripple {
            position: absolute; 
            top: 50%; left: 50%; 
            transform: translate(-50%, -50%);
            border: 8px solid rgba(255, 255, 255, 0.7); 
            border-radius: 50%;
            pointer-events: none; 
            z-index: 8; 
            animation: rippleEffect 0.8s ease-out forwards;
        }

        @keyframes rippleEffect { 
            0% { width: 0; height: 0; opacity: 1; } 
            100% { width: 80vmin; height: 80vmin; opacity: 0; } 
        }
    </style>
</head>
<body>

    <!-- 1. 影片層 -->
    <video id="video-layer" class="layer" autoplay loop muted playsinline>
        <source src="background1.mov" type="video/quicktime">
        <source src="background1.mp4" type="video/mp4">
    </video>

    <!-- 2. 魚群容器 -->
    <div id="fish-layer" class="layer"></div>

    <!-- 3. 互動層 -->
    <div class="layer interactive-zone">
        <div id="lock-container">
            <img src="Lock.png" id="lock-img" alt="Lock">
        </div>
    </div>

    <script>
        const lockContainer = document.getElementById('lock-container');

        // 點擊事件
        lockContainer.addEventListener('click', () => {
            // 觸發縮放反應
            lockContainer.classList.add('bump');
            setTimeout(() => lockContainer.classList.remove('bump'), 100);
            
            // 觸發波紋
            createRipple();
        });

        function createRipple() {
            const ripple = document.createElement('div');
            ripple.className = 'ripple';
            lockContainer.appendChild(ripple);
            // 動畫結束後移除
            setTimeout(() => ripple.remove(), 800);
        }
    </script>
</body>
</html>
