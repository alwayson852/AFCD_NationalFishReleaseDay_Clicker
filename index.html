<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sea Interactive - Single Full Screen Fish</title>
    <style>
        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            overflow: hidden; background-color: #000;
            font-family: "PingFang HK", "Microsoft JhengHei", sans-serif;
        }

        .layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        /* 1. 底層背景圖 */
        .bg-base { 
            background: url('background.jpg') no-repeat center center; 
            background-size: cover; 
            z-index: 1; 
        }

        /* 2. 影片層 (background1) */
        #video-layer { 
            z-index: 2; 
            object-fit: cover; 
            pointer-events: none; 
        }

        /* 3. 網格層 (net) */
        .net-layer { 
            background: url('net.png') no-repeat center center; 
            background-size: cover; 
            z-index: 3; 
            pointer-events: none; 
        }

        /* 4. 單張全屏魚圖層 (位於 Net 之上，Lock 之下) */
        #fish-layer {
            z-index: 5;
            pointer-events: none;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .single-fish {
            width: 100vw;
            height: 100vh;
            /* cover: 鋪滿全屏並自動裁切邊緣 | contain: 顯示完整圖片但可能有黑邊 */
            object-fit: contain; 
            opacity: 1;
            filter: brightness(0.5) contrast(1.4) drop-shadow(0 0 10px rgba(255, 255, 255, 0.3));
            /* 平滑呼吸縮放動畫 */
            animation: fishBreath 6s ease-in-out infinite;
            will-change: transform;
        }

        @keyframes fishBreath {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); } /* 輕微縮放，更有深海感 */
        }

        /* 5. 互動層：Lock */
        .interactive-zone {
            z-index: 10;
            display: flex; 
            justify-content: center; 
            align-items: center;
            pointer-events: none;
        }

        #lock-container {
            position: relative;
            width: 35vmin; 
            height: 35vmin;
            display: flex; 
            justify-content: center; 
            align-items: center;
            cursor: pointer;
            pointer-events: auto;
            -webkit-tap-highlight-color: transparent;
        }

        #lock-img {
            width: 100%; 
            height: auto;
            z-index: 12;
            transition: transform 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #lock-container.bump #lock-img { transform: scale(0.8); }

        /* 粗邊框波紋 (Ripple) */
        .ripple {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            border: 10px solid rgba(255, 255, 255, 0.8);
            background: radial-gradient(circle, rgba(255,255,255,0.4) 0%, rgba(255,255,255,0) 70%);
            border-radius: 50%;
            pointer-events: none;
            z-index: 8;
            animation: rippleEffect 1s ease-out forwards;
        }

        @keyframes rippleEffect {
            0% { width: 0; height: 0; opacity: 1; border-width: 15px; }
            100% { width: 120vmin; height: 120vmin; opacity: 0; border-width: 2px; }
        }

        /* 彈出文字 */
        .pop-text {
            position: absolute;
            color: #fff;
            font-size: 8vmin;
            font-weight: bold;
            text-shadow: 0 0 10px rgba(0,122,255,0.9);
            z-index: 20;
            pointer-events: none;
            animation: textJump 1.2s ease-out forwards;
        }

        @keyframes textJump {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
            20% { opacity: 1; transform: translate(-50%, -50%) scale(1.2) translateY(-20px); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(1) translateY(-120px); }
        }
    </style>
</head>
<body>

    <div class="layer bg-base"></div>

    <video id="video-layer" class="layer" autoplay loop muted playsinline>
        <source src="background1.mov" type="video/quicktime">
        <source src="background1.mp4" type="video/mp4">
    </video>

    <div class="layer net-layer"></div>

    <!-- 魚群層 (現在只有一張大魚) -->
    <div id="fish-layer" class="layer">
        <img src="Fish.png" class="single-fish" alt="Fish">
    </div>

    <div class="layer interactive-zone">
        <div id="lock-container">
            <img src="Lock.png" id="lock-img" alt="Lock">
        </div>
    </div>

    <script>
        const lockContainer = document.getElementById('lock-container');
        const slogans = ["加油！", "給力！", "Fighting!",  "大豐收！", "衝呀！", "掂呀！", "Good Job!"];

        lockContainer.addEventListener('click', () => {
            lockContainer.classList.add('bump');
            setTimeout(() => lockContainer.classList.remove('bump'), 100);

            createRipple();
            createPopText();
        });

        function createRipple() {
            const ripple = document.createElement('div');
            ripple.className = 'ripple';
            lockContainer.appendChild(ripple);
            setTimeout(() => ripple.remove(), 1000);
        }

        function createPopText() {
            const text = document.createElement('div');
            text.className = 'pop-text';
            text.innerText = slogans[Math.floor(Math.random() * slogans.length)];

            const angle = Math.random() * Math.PI * 2;
            const minDist = 180; 
            const dist = minDist + Math.random() * 80;

            const x = window.innerWidth / 2 + Math.cos(angle) * dist;
            const y = window.innerHeight / 2 + Math.sin(angle) * dist;

            text.style.left = x + 'px';
            text.style.top = y + 'px';
            text.style.transform = 'translate(-50%, -50%)';

            document.body.appendChild(text);
            setTimeout(() => text.remove(), 1200);
        }
    </script>
</body>
</html>
