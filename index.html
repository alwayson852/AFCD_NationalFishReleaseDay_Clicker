<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sea Interactive - Full Layers</title>
    <style>
        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            overflow: hidden; background-color: #000;
            font-family: "PingFang HK", "Microsoft JhengHei", sans-serif;
        }

        .layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        /* 0. 最底層背景圖 */
        .bg-base { 
            background: url('background.jpg') no-repeat center center; 
            background-size: cover; 
            z-index: 0; 
        }

        /* 1. 影片層 */
        #video-layer { 
            z-index: 1; 
            object-fit: cover; 
            pointer-events: none; 
            /* 如果影片有透明度，保持為 1；若想讓底圖透出，可微調 opacity */
            opacity: 1; 
        }

        /* 2. 魚群容器 */
        #fish-layer {
            z-index: 5;
            pointer-events: none;
            position: absolute;
            width: 100%; height: 100%;
        }

        .collected-fish {
            position: absolute;
            width: 17vmin; 
            height: auto;
            opacity: 0;
            filter: brightness(1.2) contrast(1.2) drop-shadow(0 0 8px rgba(255, 255, 255, 0.8));
            will-change: transform, opacity;
            animation: 
                justFadeIn 0.8s ease-out forwards, 
                fishWiggleZoom 3s ease-in-out infinite;
        }

        @keyframes justFadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }

        @keyframes fishWiggleZoom {
            0%, 100% { transform: translate(-50%, -50%) rotate(0deg) scale(1); }
            25% { transform: translate(-50%, -50%) rotate(5deg) scale(1.08); }
            75% { transform: translate(-50%, -50%) rotate(-5deg) scale(0.96); }
        }

        /* 3. 互動層：Lock */
        .interactive-zone {
            z-index: 10;
            display: flex; justify-content: center; align-items: center;
            pointer-events: none;
        }

        #lock-container {
            position: relative; 
            width: 35vmin; height: 35vmin;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; pointer-events: auto;
            -webkit-tap-highlight-color: transparent;
        }

        #lock-img {
            width: 100%; height: auto; z-index: 12;
            transition: transform 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #lock-container.bump #lock-img { transform: scale(0.8); }

        .ripple {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            border: 8px solid rgba(255, 255, 255, 0.7); border-radius: 50%;
            pointer-events: none; z-index: 8; animation: rippleEffect 0.8s ease-out forwards;
        }
        @keyframes rippleEffect { 0% { width: 0; height: 0; opacity: 1; } 100% { width: 80vmin; height: 80vmin; opacity: 0; } }
    </style>
</head>
<body>

    <!-- 0. 最底層靜態圖 -->
    <div class="layer bg-base"></div>

    <!-- 1. 影片層 -->
    <video id="video-layer" class="layer" autoplay loop muted playsinline>
        <source src="background1.mov" type="video/quicktime">
        <source src="background1.mp4" type="video/mp4">
    </video>

    <!-- 2. 魚群層 -->
    <div id="fish-layer" class="layer"></div>

    <!-- 3. 互動層 -->
    <div class="layer interactive-zone">
        <div id="lock-container">
            <img src="Lock.png" id="lock-img" alt="Lock">
        </div>
    </div>

    <script>
        const lockContainer = document.getElementById('lock-container');
        const fishLayer = document.getElementById('fish-layer');
        const fishPool = ['Fish1.png', 'Fish2.png', 'Fish3.png', 'Fish4.png', 'Fish5.png', 'Fish6.png'];

        function initCloserFish() {
            for (let i = 0; i < 30; i++) {
                spawnFish(25, 30); 
            }
        }

        lockContainer.addEventListener('click', () => {
            lockContainer.classList.add('bump');
            setTimeout(() => lockContainer.classList.remove('bump'), 100);
            createRipple();
            spawnFish(12, 33);
        });

        function spawnFish(baseRadius, range) {
            const randomSrc = fishPool[Math.floor(Math.random() * fishPool.length)];
            const img = document.createElement('img');
            img.src = randomSrc;
            img.className = 'collected-fish';

            const angle = Math.random() * Math.PI * 2;
            const radius = baseRadius + Math.random() * range; 
            
            const x = 50 + radius * Math.cos(angle);
            const y = 50 + radius * Math.sin(angle);

            img.style.left = x + '%';
            img.style.top = y + '%';

            const flip = Math.random() > 0.5 ? 1 : -1;
            img.style.transform = `translate(-50%, -50%) scaleX(${flip})`;

            const animDelay = Math.random() * -5;
            img.style.animationDelay = `0s, ${animDelay}s`; 
            
            fishLayer.appendChild(img);
        }

        function createRipple() {
            const ripple = document.createElement('div');
            ripple.className = 'ripple';
            lockContainer.appendChild(ripple);
            setTimeout(() => ripple.remove(), 800);
        }

        window.onload = initCloserFish;

    </script>
</body>
</html>
