<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Fish Event - Wiggle Effect</title>
    <style>
        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            overflow: hidden; background-color: #000;
            font-family: "PingFang HK", "Microsoft JhengHei", sans-serif;
        }

        .full-screen {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
        }

        .bg-layer { background: url('background.jpg') no-repeat center center; background-size: cover; z-index: 1; }
        #video-layer { z-index: 2; object-fit: cover; pointer-events: none; }
        .cage-layer { background: url('cage.png') no-repeat center center; background-size: cover; z-index: 3; pointer-events: none; }

        /* 魚隻基礎樣式 */
        .fish-element {
            position: absolute;
            width: 50px; 
            height: auto;
            z-index: 4; 
            pointer-events: none;
            opacity: 0.85;
            /* 讓每條魚的動畫初始狀態隨機化 */
            animation: wiggle 4s ease-in-out infinite;
        }

        /* Wiggle 擺動動畫：輕微位移 + 旋轉 */
        @keyframes wiggle {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(5px, 3px) rotate(3deg); }
            50% { transform: translate(-3px, 5px) rotate(-2deg); }
            75% { transform: translate(-5px, -2px) rotate(2deg); }
        }

        .ui-layer { z-index: 10; display: flex; justify-content: center; align-items: center; pointer-events: none; }
        #lock-btn {
            width: 30vmin; height: 30vmin;
            background: url('Lock.png') no-repeat center center; background-size: contain;
            cursor: pointer; pointer-events: auto; outline: none; -webkit-tap-highlight-color: transparent;
        }

        .slogan {
            position: absolute; color: #ffffff; font-size: 8vmin; font-weight: bold;
            text-shadow: 0 0 10px #007AFF, 0 0 20px rgba(0,0,0,0.8);
            z-index: 20; pointer-events: none; white-space: nowrap;
            animation: popOut 1.2s ease-out forwards;
        }

        @keyframes popOut {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.3); }
            30% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(1); }
        }
    </style>
</head>
<body>

    <div class="full-screen bg-layer"></div>
    <video id="video-layer" class="full-screen" autoplay loop muted playsinline>
        <source src="Fishflow.mov" type="video/quicktime">
        <source src="Fishflow.mp4" type="video/mp4">
    </video>
    <div class="full-screen cage-layer"></div>

    <div id="fish-tank" class="full-screen"></div>

    <div class="full-screen ui-layer">
        <div id="lock-btn"></div>
    </div>

    <script>
        const lockBtn = document.getElementById('lock-btn');
        const fishTank = document.getElementById('fish-tank');
        const slogans = ["加油！", "全力以赴", "Fighting!", "大豐收！", "衝呀！", "給力！"];

        // 初始化魚群
        function initFish() {
            const fishCount = 80; // 增加一點數量讓魚群更豐富
            for (let i = 0; i < fishCount; i++) {
                const fish = document.createElement('img');
                fish.src = 'fish.png';
                fish.className = 'fish-element';
                
                // 隨機生成位置
                const x = Math.random() * 80 + 10; // 避開邊緣
                const y = Math.random() * 80 + 10;
                const scale = 0.4 + Math.random() * 0.4;
                
                // 隨機左右朝向
                const flip = Math.random() > 0.5 ? 1 : -1;

                fish.style.left = x + '%';
                fish.style.top = y + '%';
                
                // 為了讓魚群看起來不僵硬，給每條魚隨機的動畫長度和延遲
                const duration = 3 + Math.random() * 3; // 3-6秒完成一次擺動
                const delay = Math.random() * -5; // 隨機初始進度
                
                fish.style.animationDuration = `${duration}s`;
                fish.style.animationDelay = `${delay}s`;
                fish.style.transform = `scale(${scale}) scaleX(${flip})`;

                fishTank.appendChild(fish);
            }
        }

        // 鎖頭字句邏輯
        lockBtn.addEventListener('click', () => {
            const text = document.createElement('div');
            text.className = 'slogan';
            text.innerText = slogans[Math.floor(Math.random() * slogans.length)];
            
            // 隨機在鎖頭附近生成
            const x = Math.random() * 60 + 20;
            const y = Math.random() * 60 + 20;
            text.style.left = x + '%';
            text.style.top = y + '%';
            text.style.transform = 'translate(-50%, -50%)';

            document.body.appendChild(text);
            setTimeout(() => text.remove(), 1200);
        });

        window.onload = initFish;
    </script>
</body>
</html>
