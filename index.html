<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sea Event Interactive</title>
    <style>
        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            overflow: hidden; background-color: #000;
            font-family: "PingFang HK", "Microsoft JhengHei", sans-serif;
        }

        .full-screen {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
        }

        /* 第一層：底圖 */
        .bg-layer {
            background: url('background.jpg') no-repeat center center;
            background-size: cover;
            z-index: 1;
        }

        /* 第二層：影片 */
        #video-layer {
            z-index: 2;
            object-fit: cover;
            pointer-events: none;
        }

        /* 第三層：魚籠圖層 (與背景同處理) */
        .cage-layer {
            background: url('cage.png') no-repeat center center;
            background-size: cover;
            z-index: 3;
            pointer-events: none;
        }

        /* 第四層：圓形魚缸 (限制魚群範圍) */
/* 修改魚缸容器，使其成為全屏層，與背景完全對齊 */
#fish-tank {
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 4;
    pointer-events: none;
    /* 取消圓形裁切，因為我們要直接在全屏中對位 */
    overflow: visible; 
}

.fish-element {
    position: absolute;
    width: 70px; 
    height: auto;
    opacity: 0.95;
    filter: brightness(0.5) contrast(1.4) drop-shadow(0 0 4px rgba(255, 255, 255, 0.4));
    animation: wiggle 4s ease-in-out infinite;
    will-change: transform;
}
        @keyframes wiggle {
            0%, 100% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(4px, 2px) rotate(3deg); }
            50% { transform: translate(-2px, 4px) rotate(-2deg); }
            75% { transform: translate(-4px, -2px) rotate(2deg); }
        }

        /* 第五層：UI 互動 */
        .ui-layer {
            z-index: 10;
            display: flex;
            justify-content: center;
            align-items: center;
            pointer-events: none;
        }

        #lock-btn {
            width: 30vmin;
            height: 30vmin;
            background: url('Lock.png') no-repeat center center;
            background-size: contain;
            cursor: pointer;
            pointer-events: auto;
            outline: none;
            -webkit-tap-highlight-color: transparent;
            transition: transform 0.1s ease;
        }

        #lock-btn:active { transform: scale(0.9); }

        .slogan {
            position: absolute;
            color: #ffffff;
            font-size: 7vmin;
            font-weight: bold;
            text-shadow: 0 0 10px #007AFF, 0 0 20px rgba(0,0,0,0.8);
            z-index: 20;
            pointer-events: none;
            white-space: nowrap;
            animation: popOut 1.2s ease-out forwards;
        }

        @keyframes popOut {
            0% { opacity: 0; transform: translate(-50%, -50%) scale(0.3); }
            30% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
            100% { opacity: 0; transform: translate(-50%, -50%) scale(1); }
        }
    </style>
</head>
<body>

    <div class="full-screen bg-layer"></div>

    <video id="video-layer" class="full-screen" autoplay loop muted playsinline>
        <source src="Fishflow.mov" type="video/quicktime">
        <source src="Fishflow.mp4" type="video/mp4">
    </video>

    <div class="full-screen cage-layer"></div>

    <!-- 魚群會被限制在這個圓圈容器內 -->
    <div id="fish-tank"></div>

    <div class="full-screen ui-layer">
        <div id="lock-btn"></div>
    </div>

    <script>
        const lockBtn = document.getElementById('lock-btn');
        const fishTank = document.getElementById('fish-tank');
        const slogans = ["加油！", "全力以赴", "Fighting!", "大豐收！", "衝呀！", "給力！", "掂呀！", "Good Job!"];

       function initFish() {
    const fishCount = 50; 
    for (let i = 0; i < fishCount; i++) {
        const fish = document.createElement('img');
        fish.src = 'fish.png';
        fish.className = 'fish-element';
        
        // --- 修改後的左右散開邏輯 ---
        const angle = Math.random() * Math.PI * 3;
        
        // 1. 調整半徑隨機值
        const radius = Math.sqrt(Math.random());
        
        // 2. 分別設定 X 和 Y 的散開程度
        // 把原本的 30 改成：橫向(X)散開 40%，縱向(Y)保持 25%
        // 這樣魚群就會呈現「扁平橢圓形」分佈
        const spreadX = 60; 
        const spreadY = 30;

        const x = 50 + (radius * spreadX) * Math.cos(angle);
        const y = 50 + (radius * spreadY) * Math.sin(angle);
        
        const scale = 0.3 + Math.random() * 0.4;
        const flip = Math.random() > 0.5 ? 1 : -1;

        fish.style.left = x + '%';
        fish.style.top = y + '%';
        
        // 動畫與濾鏡保持不變
        const duration = 3 + Math.random() * 3;
        const delay = Math.random() * -5;
        fish.style.animationDuration = `${duration}s`;
        fish.style.animationDelay = `${delay}s`;
        fish.style.transform = `translate(-50%, -50%) scale(${scale}) scaleX(${flip})`;

        fishTank.appendChild(fish);
    }
}

        // 點擊鎖頭：隨機字眼並避開中心
        lockBtn.addEventListener('click', () => {
            const text = document.createElement('div');
            text.className = 'slogan';
            text.innerText = slogans[Math.floor(Math.random() * slogans.length)];
            
            const lockRect = lockBtn.getBoundingClientRect();
            let x, y, safe = false;

            while(!safe) {
                // 生成在畫面 10% - 90% 之間
                x = Math.random() * 80 + 10;
                y = Math.random() * 80 + 10;
                const px = (x/100) * window.innerWidth;
                const py = (y/100) * window.innerHeight;

                // 避開鎖頭矩形區域
                if (!(px > lockRect.left - 20 && px < lockRect.right + 20 && 
                      py > lockRect.top - 20 && py < lockRect.bottom + 20)) {
                    safe = true;
                }
            }

            text.style.left = x + '%';
            text.style.top = y + '%';
            document.body.appendChild(text);

            setTimeout(() => text.remove(), 1200);
        });

        window.onload = initFish;
    </script>
</body>
</html>
