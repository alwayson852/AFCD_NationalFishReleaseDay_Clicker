<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sea Interactive - Infinite Fish Exhibit</title>
    <style>
        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            overflow: hidden; background-color: #000;
            font-family: "PingFang HK", "Microsoft JhengHei", sans-serif;
            
            /* 強制封鎖成個網頁嘅手機拉扯同預設縮放行為 */
            touch-action: none; 
            -webkit-user-select: none;
            user-select: none;
        }

        .layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        /* 0. 最底層背景圖 */
        .bg-base { 
            background: url('background.jpg') no-repeat center center; 
            background-size: cover; 
            z-index: 0; 
        }

        /* 0.5 氣泡層 */
        #bubble-layer {
            z-index: 2;
            pointer-events: none;
            position: absolute;
            width: 100%; height: 100%;
            overflow: hidden;
        }

        .bubble {
            position: absolute; bottom: -50px;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.6) 0%, rgba(255, 255, 255, 0.1) 40%, rgba(255, 255, 255, 0.4) 70%, rgba(255, 255, 255, 0) 100%);
            border: 1px solid rgba(255, 255, 255, 0.4); border-radius: 50%;
            pointer-events: none; will-change: transform, opacity;
            animation: floatUpAndFade 8s linear forwards, bubbleWobble 4s ease-in-out infinite;
        }

        @keyframes floatUpAndFade {
            0% { transform: translateY(0); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(-110vh); opacity: 0; }
        }

        @keyframes bubbleWobble {
            0%, 100% { margin-left: 0px; }
            50% { margin-left: 25px; }
        }

        /* 1. 魚群容器 */
        #fish-layer {
            z-index: 5;
            pointer-events: none;
            position: absolute;
            width: 100%; height: 100%;
        }

        .collected-fish {
            position: absolute; width: 17vmin; height: auto; opacity: 0;
            filter: brightness(1.2) contrast(1.2) drop-shadow(0 0 8px rgba(255, 255, 255, 0.8));
            will-change: transform, opacity;
            animation: justFadeIn 0.8s ease-out forwards, fishWiggleZoom 3s ease-in-out infinite;
        }

        @keyframes justFadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }

        @keyframes fishWiggleZoom {
            0%, 100% { transform: translate(-50%, -50%) rotate(0deg) scale(1); }
            25% { transform: translate(-50%, -50%) rotate(5deg) scale(1.08); }
            75% { transform: translate(-50%, -50%) rotate(-5deg) scale(0.96); }
        }

        /* 2. 互動層：Lock */
        .interactive-zone {
            z-index: 10;
            display: flex; justify-content: center; align-items: center;
            pointer-events: none;
        }

        #lock-container {
            position: relative; width: 35vmin; height: 35vmin;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; pointer-events: auto;
            -webkit-tap-highlight-color: transparent;
            
            /* 核心：鎖死呢個掣喺手機上嘅雙擊放大行為 */
            touch-action: manipulation; 
        }

        #lock-img {
            width: 100%; height: auto; z-index: 12;
            transition: transform 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        #lock-container.bump #lock-img { transform: scale(0.8); }

        .ripple {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            border: 8px solid rgba(255, 255, 255, 0.7); border-radius: 50%;
            pointer-events: none; z-index: 8; animation: rippleEffect 0.8s ease-out forwards;
        }
        @keyframes rippleEffect { 0% { width: 0; height: 0; opacity: 1; } 100% { width: 80vmin; height: 80vmin; opacity: 0; } }
    </style>
</head>
<body>

    <div class="layer bg-base"></div>

    <div id="bubble-layer" class="layer"></div>
    <div id="fish-layer" class="layer"></div>

    <div class="layer interactive-zone">
        <div id="lock-container">
            <img src="Lock.png" id="lock-img" alt="Lock">
        </div>
    </div>

    <script>
        const lockContainer = document.getElementById('lock-container');
        const fishLayer = document.getElementById('fish-layer');
        const bubbleLayer = document.getElementById('bubble-layer');
        const fishPool = ['Fish1.png', 'Fish2.png', 'Fish3.png', 'Fish4.png', 'Fish5.png', 'Fish6.png'];

        function initExhibit() {
            for (let i = 0; i < 30; i++) {
                spawnFish(25, 30); 
            }
            startBubbleLoop();
        }

        function startBubbleLoop() {
            for (let i = 0; i < 15; i++) {
                createBubble(Math.random() * -100); 
            }
            setInterval(() => { createBubble(0); }, 400);
        }

        function createBubble(initialYOffsetPercent) {
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            const size = Math.random() * 15 + 8; 
            const leftPos = Math.random() * 100; 
            const duration = Math.random() * 4 + 6; 
            const wobbleDuration = Math.random() * 2 + 2; 
            const blurEffect = Math.random() * 2; 

            bubble.style.width = size + 'px';
            bubble.style.height = size + 'px';
            bubble.style.left = leftPos + '%';
            bubble.style.animationDuration = `${duration}s, ${wobbleDuration}s`;
            
            if (blurEffect > 1.2) {
                bubble.style.filter = `blur(${blurEffect - 1.2}px)`; 
            }
            if (initialYOffsetPercent < 0) {
                bubble.style.bottom = 'unset';
                bubble.style.top = Math.random() * 100 + 'vh';
            }

            bubbleLayer.appendChild(bubble);
            setTimeout(() => { bubble.remove(); }, duration * 1000);
        }

        // 點擊事件：已拔除次數限制，每㩒一下必定出一條魚
        lockContainer.addEventListener('click', () => {
            lockContainer.classList.add('bump');
            setTimeout(() => lockContainer.classList.remove('bump'), 100);
            createRipple();
            spawnFish(12, 33);
        });

        function spawnFish(baseRadius, range) {
            const randomSrc = fishPool[Math.floor(Math.random() * fishPool.length)];
            const img = document.createElement('img');
            img.src = randomSrc;
            img.className = 'collected-fish';

            const angle = Math.random() * Math.PI * 2;
            const radius = baseRadius + Math.random() * range; 
            
            const x = 50 + radius * Math.cos(angle);
            const y = 50 + radius * Math.sin(angle);

            img.style.left = x + '%';
            img.style.top = y + '%';

            const flip = Math.random() > 0.5 ? 1 : -1;
            img.style.transform = `translate(-50%, -50%) scaleX(${flip})`;

            const animDelay = Math.random() * -5;
            img.style.animationDelay = `0s, ${animDelay}s`; 
            
            fishLayer.appendChild(img);
        }

        function createRipple() {
            const ripple = document.createElement('div');
            ripple.className = 'ripple';
            lockContainer.appendChild(ripple);
            setTimeout(() => ripple.remove(), 800);
        }

        // ==========================================
        // 🛠️ JS 物理防護：全面攔截 iOS/Android 手機縮放事件
        // ==========================================
        
        // 1. 封鎖雙指拉扯縮放 (Pinch to Zoom)
        document.addEventListener('touchstart', function (event) {
            if (event.touches.length > 1) {
                event.preventDefault(); 
            }
        }, { passive: false });

        // 2. 封鎖狂㩒掣時嘅預設雙擊放大 (Double Tap to Zoom)
        let lastTouchEnd = 0;
        document.addEventListener('touchend', function (event) {
            const now = (new Date()).getTime();
            if (now - lastTouchEnd <= 300) {
                event.preventDefault(); 
            }
            lastTouchEnd = now;
        }, { passive: false });

        window.onload = initExhibit;
    </script>
</body>
</html>
