<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Agriculture, Fisheries and Conservation Department</title>
    <style>
        body, html {
            margin: 0; padding: 0; height: 100%; width: 100%;
            overflow: hidden; background-color: #000;
            font-family: "PingFang HK", "Microsoft JhengHei", sans-serif;
            touch-action: none;
            -webkit-user-select: none;
            user-select: none;
        }

        .layer { position: absolute; top: 0; left: 0; width: 100%; height: 100%; }

        /* 0. 最底層背景圖 */
        .bg-base { 
            background: url('background.jpg') no-repeat center center; 
            background-size: cover; 
            z-index: 0; 
        }

        /* 0.5 氣泡層 */
        #bubble-layer {
            z-index: 2;
            pointer-events: none;
            position: absolute;
            width: 100%; height: 100%;
            overflow: hidden;
        }

        .bubble {
            position: absolute; bottom: -50px;
            background: radial-gradient(circle at 30% 30%, rgba(255, 255, 255, 0.6) 0%, rgba(255, 255, 255, 0.1) 40%, rgba(255, 255, 255, 0.4) 70%, rgba(255, 255, 255, 0) 100%);
            border: 1px solid rgba(255, 255, 255, 0.4); border-radius: 50%;
            pointer-events: none; will-change: transform, opacity;
            animation: floatUpAndFade 8s linear forwards, bubbleWobble 4s ease-in-out infinite;
        }

        @keyframes floatUpAndFade {
            0% { transform: translateY(0); opacity: 0; }
            10% { opacity: 0.8; }
            90% { opacity: 0.8; }
            100% { transform: translateY(-110vh); opacity: 0; }
        }

        @keyframes bubbleWobble {
            0%, 100% { margin-left: 0px; }
            50% { margin-left: 25px; }
        }

        /* 1. 魚群容器 */
        #fish-layer {
            z-index: 5;
            pointer-events: none;
            position: absolute;
            width: 100%; height: 100%;
        }

        .collected-fish {
            position: absolute; width: 17vmin; height: auto; opacity: 0;
            filter: brightness(1.2) contrast(1.2) drop-shadow(0 0 8px rgba(255, 255, 255, 0.8));
            will-change: transform, opacity;
        }

        /* 魚隻純左右 Wiggle 擺動 */
        .fish-flip-right { animation: justFadeIn 0.8s ease-out forwards, wiggleRight 3s ease-in-out infinite; }
        .fish-flip-left { animation: justFadeIn 0.8s ease-out forwards, wiggleLeft 3s ease-in-out infinite; }

        @keyframes justFadeIn { 0% { opacity: 0; } 100% { opacity: 1; } }

        @keyframes wiggleRight {
            0%, 100% { transform: translate(-50%, -50%) scaleX(1) rotate(0deg); }
            25% { transform: translate(-50%, -50%) scaleX(1) rotate(5deg); }
            75% { transform: translate(-50%, -50%) scaleX(1) rotate(-5deg); }
        }

        @keyframes wiggleLeft {
            0%, 100% { transform: translate(-50%, -50%) scaleX(-1) rotate(0deg); }
            25% { transform: translate(-50%, -50%) scaleX(-1) rotate(-5deg); }
            75% { transform: translate(-50%, -50%) scaleX(-1) rotate(5deg); }
        }

        /* 2. 互動層：Lock */
        .interactive-zone {
            z-index: 10;
            display: flex; justify-content: center; align-items: center;
            pointer-events: none;
        }

        #lock-container {
            position: relative; width: 35vmin; height: 35vmin;
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; pointer-events: auto;
            -webkit-tap-highlight-color: transparent;
        }

        #lock-img {
            width: 100%; height: auto; z-index: 12;
            transition: transform 0.1s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        /* [已恢復] 點擊時 Lock 掣本體縮小 */
        #lock-container.bump #lock-img { transform: scale(0.85); }

        /* [已恢復] 標準 Ripple 水波紋樣式 */
        .ripple {
            position: absolute; 
            top: 50%; left: 50%; 
            transform: translate(-50%, -50%);
            border: 6px solid rgba(255, 255, 255, 0.75); 
            border-radius: 50%;
            pointer-events: none; 
            z-index: 8; 
            animation: rippleEffect 0.7s ease-out forwards;
        }

        @keyframes rippleEffect { 
            0% { width: 0vmin; height: 0vmin; opacity: 1; } 
            100% { width: 85vmin; height: 85vmin; opacity: 0; } 
        }
    </style>
</head>
<body>

    <div class="layer bg-base"></div>

    <div id="bubble-layer" class="layer"></div>
    <div id="fish-layer" class="layer"></div>

    <div class="layer interactive-zone">
        <div id="lock-container">
            <img src="Lock.png" id="lock-img" alt="Lock">
        </div>
    </div>

    <script>
        const lockContainer = document.getElementById('lock-container');
        const fishLayer = document.getElementById('fish-layer');
        const bubbleLayer = document.getElementById('bubble-layer');
        const fishPool = ['Fish1.png', 'Fish2.png', 'Fish3.png', 'Fish4.png', 'Fish5.png', 'Fish6.png'];

        let activeBubbles = 0;
        const maxBubbles = 25; 

        function initExhibit() {
            const totalInitialFish = 30;
            for (let i = 0; i < totalInitialFish; i++) {
                const baseAngle = (i / totalInitialFish) * Math.PI * 2;
                const jitterAngle = (Math.random() * 0.4) - 0.2; 
                const angle = baseAngle + jitterAngle;

                let baseRadius;
                if (i % 3 === 0) { baseRadius = 22; } 
                else if (i % 3 === 1) { baseRadius = 34; } 
                else { baseRadius = 46; }
                const radius = baseRadius + (Math.random() * 8 - 4); 

                spawnFishAt(angle, radius);
            }
            startBubbleLoop();
            
            console.log(`[Live Fish Count]: ${fishLayer.getElementsByTagName('img').length}`);
        }

        function spawnFishAt(angle, radius) {
            const randomSrc = fishPool[Math.floor(Math.random() * fishPool.length)];
            const img = document.createElement('img');
            img.src = randomSrc;

            const x = 50 + radius * Math.cos(angle);
            const y = 50 + radius * Math.sin(angle);

            img.style.left = x + '%';
            img.style.top = y + '%';

            const isFlip = Math.random() > 0.5;
            img.className = `collected-fish ${isFlip ? 'fish-flip-left' : 'fish-flip-right'}`;

            const animDelay = Math.random() * -5;
            img.style.animationDelay = `0s, ${animDelay}s`; 
            
            fishLayer.appendChild(img);
        }

        function startBubbleLoop() {
            for (let i = 0; i < 10; i++) { createBubble(Math.random() * -100); }
            setInterval(() => { createBubble(0); }, 600);
        }

        function createBubble(initialYOffsetPercent) {
            if (activeBubbles >= maxBubbles && initialYOffsetPercent === 0) return;

            activeBubbles++;
            const bubble = document.createElement('div');
            bubble.className = 'bubble';
            const size = Math.random() * 12 + 6; 
            const leftPos = Math.random() * 100; 
            const duration = Math.random() * 4 + 6; 
            const wobbleDuration = Math.random() * 2 + 2; 
            const blurEffect = Math.random() * 2; 

            bubble.style.width = size + 'px';
            bubble.style.height = size + 'px';
            bubble.style.left = leftPos + '%';
            bubble.style.animationDuration = `${duration}s, ${wobbleDuration}s`;
            
            if (blurEffect > 1.4) { bubble.style.filter = `blur(${blurEffect - 1.4}px)`; }
            if (initialYOffsetPercent < 0) {
                bubble.style.bottom = 'unset';
                bubble.style.top = Math.random() * 100 + 'vh';
            }

            bubbleLayer.appendChild(bubble);

            setTimeout(() => {
                bubble.remove();
                activeBubbles--;
            }, duration * 1000);
        }

        // ==========================================
        // 🚀 執行動畫
        // ==========================================
        lockContainer.addEventListener('pointerdown', (e) => {
            e.preventDefault(); 
            
            // 觸發 Bump 縮小
            lockContainer.classList.add('bump');
            
            // 觸發水波紋
            createRipple();
            
            // 100毫秒後放開還原大細
            setTimeout(() => lockContainer.classList.remove('bump'), 100);
        });

        function createRipple() {
            const ripple = document.createElement('div');
            ripple.className = 'ripple';
            lockContainer.appendChild(ripple);
            // 動畫播完（700ms）後徹底消滅該 DOM 元素
            setTimeout(() => ripple.remove(), 700);
        }

        window.onload = initExhibit;
    </script>
</body>
</html>
